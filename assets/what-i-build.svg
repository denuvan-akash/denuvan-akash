<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="What I build: Android keyboards, WhatsApp bots, 3D web experiences">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f0c29"/><stop offset="0.55" stop-color="#1d1650"/><stop offset="1" stop-color="#24243e"/>
  </linearGradient>
  <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2e1f6b"/><stop offset="1" stop-color="#17123d"/>
  </linearGradient>
  <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f3d3a"/><stop offset="1" stop-color="#10222f"/>
  </linearGradient>
  <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a1d6b"/><stop offset="1" stop-color="#1b1140"/>
  </linearGradient>
  <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/>
  </linearGradient>
  <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="line3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="2" y="2" width="996" height="436" rx="26" fill="url(#bg)" stroke="#4c1d95" stroke-width="2"/>
<ellipse cx="500" cy="220" rx="480" ry="170" fill="url(#glow)"/>

<g fill="#e9d5ff">
  <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="26" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="660" cy="34" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="940" cy="52" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="418" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="414" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="420" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Card 1 : Keyboard -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="5s" repeatCount="indefinite"/>
  <rect x="40" y="40" width="290" height="360" rx="22" fill="url(#c1)" stroke="url(#line1)" stroke-width="2"/>
  <rect x="85" y="78" width="200" height="110" rx="14" fill="#1b1445" stroke="#a78bfa" stroke-width="2"/>
  <g fill="#c4b5fd">
    <rect x="100" y="94" width="24" height="20" rx="4"/><rect x="132" y="94" width="24" height="20" rx="4"/><rect x="164" y="94" width="24" height="20" rx="4"/><rect x="196" y="94" width="24" height="20" rx="4"/><rect x="228" y="94" width="24" height="20" rx="4"/>
    <rect x="100" y="122" width="24" height="20" rx="4" opacity="0.7"/><rect x="132" y="122" width="24" height="20" rx="4" opacity="0.7"/><rect x="164" y="122" width="24" height="20" rx="4" opacity="0.7"/><rect x="196" y="122" width="24" height="20" rx="4" opacity="0.7"/><rect x="228" y="122" width="24" height="20" rx="4" opacity="0.7"/>
    <rect x="116" y="152" width="138" height="20" rx="4" fill="#f0abfc"/>
  </g>
  <rect x="164" y="94" width="24" height="20" rx="4" fill="#f0abfc"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/></rect>
  <text x="185" y="236" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">Mathra Keyboard</text>
  <text x="185" y="266" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ddd6fe">Production Android IME</text>
  <text x="185" y="288" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#c4b5fd">Sinhala layouts · smooth typing</text>
  <rect x="75" y="324" width="76" height="30" rx="15" fill="#7F52FF" opacity="0.9"/>
  <text x="113" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff">Kotlin</text>
  <rect x="159" y="324" width="96" height="30" rx="15" fill="#3DDC84" opacity="0.9"/>
  <text x="207" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0b2a1a">Android</text>
  <rect x="263" y="324" width="42" height="30" rx="15" fill="#a78bfa" opacity="0.9"/>
  <text x="284" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff">IME</text>
</g>

<!-- Card 2 : WhatsApp bot -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,-8;0,0;0,-8" dur="5.6s" repeatCount="indefinite"/>
  <rect x="355" y="40" width="290" height="360" rx="22" fill="url(#c2)" stroke="url(#line2)" stroke-width="2"/>
  <line x1="500" y1="74" x2="500" y2="92" stroke="#34d399" stroke-width="3"/>
  <circle cx="500" cy="70" r="6" fill="#34d399"><animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/></circle>
  <rect x="440" y="92" width="120" height="92" rx="20" fill="#0d2d33" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="474" cy="132" r="12" fill="#a7f3d0"/>
  <circle cx="526" cy="132" r="12" fill="#a7f3d0"/>
  <circle cx="474" cy="132" r="5" fill="#064e3b"><animate attributeName="cy" values="132;135;132" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="526" cy="132" r="5" fill="#064e3b"><animate attributeName="cy" values="132;135;132" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="478" y="158" width="44" height="8" rx="4" fill="#22d3ee"/>
  <rect x="424" y="120" width="10" height="34" rx="5" fill="#34d399"/>
  <rect x="566" y="120" width="10" height="34" rx="5" fill="#34d399"/>
  <text x="500" y="236" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">WhatsApp Bots</text>
  <text x="500" y="266" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#a7f3d0">Baileys-based automation</text>
  <text x="500" y="288" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#6ee7b7">Pairing-code website</text>
  <rect x="390" y="324" width="92" height="30" rx="15" fill="#339933" opacity="0.95"/>
  <text x="436" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff">Node.js</text>
  <rect x="490" y="324" width="82" height="30" rx="15" fill="#25D366" opacity="0.95"/>
  <text x="531" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#052e16">Baileys</text>
  <rect x="580" y="324" width="50" height="30" rx="15" fill="#F7DF1E" opacity="0.95"/>
  <text x="605" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">JS</text>
</g>

<!-- Card 3 : 3D web -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="6.2s" repeatCount="indefinite"/>
  <rect x="670" y="40" width="290" height="360" rx="22" fill="url(#c3)" stroke="url(#line3)" stroke-width="2"/>
  <g transform="translate(815 132)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="5s" repeatCount="indefinite"/>
      <polygon points="0,-58 52,-28 0,2 -52,-28" fill="#e9d5ff"/>
      <polygon points="-52,-28 0,2 0,62 -52,32" fill="#a78bfa"/>
      <polygon points="52,-28 0,2 0,62 52,32" fill="#7c3aed"/>
      <polyline points="0,-58 52,-28 0,2 -52,-28 0,-58" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    </g>
  </g>
  <g fill="#f0abfc">
    <circle cx="720" cy="100" r="3"><animate attributeName="cy" values="100;88;100" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="160" r="2.5"><animate attributeName="cy" values="160;148;160" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="170" r="2"><animate attributeName="cy" values="170;158;170" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="95" r="2"><animate attributeName="cy" values="95;105;95" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="815" y="236" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">3D Web Worlds</text>
  <text x="815" y="266" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#f5d0fe">Three.js scenes &amp; particles</text>
  <text x="815" y="288" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e9d5ff">Cinematic, glowing interfaces</text>
  <rect x="705" y="324" width="92" height="30" rx="15" fill="#e5e7eb" opacity="0.95"/>
  <text x="751" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">Three.js</text>
  <rect x="805" y="324" width="62" height="30" rx="15" fill="#E34F26" opacity="0.95"/>
  <text x="836" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff">HTML5</text>
  <rect x="877" y="324" width="58" height="30" rx="15" fill="#1572B6" opacity="0.95"/>
  <text x="906" y="344" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff">CSS3</text>
</g>
</svg>
