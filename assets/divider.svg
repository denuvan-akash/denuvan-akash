<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="50" y="11" width="900" height="2" rx="1" fill="url(#g)" opacity="0.6"/>
  <circle cx="500" cy="12" r="5" fill="#c4b5fd">
    <animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="12" r="3" fill="#f0abfc">
    <animate attributeName="cx" values="50;950" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
